<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT Service — Commande</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#17202a}.app{max-width:600px;margin:auto;background:#fff;min-height:100vh}.head{background:#111827;color:#fff;padding:24px 20px}.logo{font-size:30px;font-weight:900}.sub{opacity:.85;margin-top:5px}.main{padding:18px}label{display:block;font-weight:700;font-size:14px;margin:13px 0 6px}input,select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}input,select{border:1px solid #d0d5dd;background:#fff}button{border:0;font-weight:800;cursor:pointer;margin-top:8px}.loc{background:#eef4ff}.calc{background:#111827;color:#fff}.wa{background:#16a34a;color:#fff}#map{height:280px;border-radius:12px;margin-top:14px;display:none}.quote{display:none;background:#f7f8fa;border:1px solid #e3e6ea;border-radius:13px;padding:16px;margin-top:18px}.price{font-size:31px;font-weight:900;margin:5px 0}.muted{font-size:13px;color:#667085;line-height:1.45}.success{color:#087443;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
</style></head><body><div class="app"><header class="head"><div class="logo">MT SERVICE</div><div class="sub">Transport personnel • Livraison à domicile</div></header><main class="main">
<label>Nom complet</label><input id="name" placeholder="Votre nom"><label>Téléphone</label><input id="phone" placeholder="+243 ..." type="tel">
<label>Service</label><select id="service"><option>Transport personnel</option><option>Livraison à domicile</option></select>
<label>Départ</label><input id="from" placeholder="Ex. Gombe, Kinshasa"><button class="loc" onclick="useGPS('from')">📍 Utiliser ma position</button>
<label>Destination</label><input id="to" placeholder="Ex. Limete, Kinshasa"><button class="loc" onclick="useGPS('to')">📍 Utiliser ma position</button>
<div class="row"><button class="calc" onclick="calculateRoute()">🧮 Calculer le prix</button><button class="loc" onclick="resetForm()">↺ Effacer</button></div>
<div id="map"></div><section id="quote" class="quote"><div class="success">✓ Prix calculé avant confirmation</div><div class="muted">Distance par route</div><div id="distance">—</div><div class="muted" style="margin-top:9px">1 000 FC / km • minimum 2 000 FC</div><div class="price" id="price">— FC</div><div class="muted">Le prix affiché est celui envoyé dans la commande WhatsApp.</div><button class="wa" onclick="sendWhatsApp()">✅ Confirmer la commande sur WhatsApp</button></section>
<p class="muted" style="margin-top:18px">MT Service • WhatsApp : +243 861 519 618</p></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,markers=[],routeLine=null,lastQuote=null;const $=id=>document.getElementById(id);
function showMap(){if(!map){map=L.map('map').setView([-4.325,15.322],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map)}$('map').style.display='block';setTimeout(()=>map.invalidateSize(),100)}
async function geocode(q){const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cd&q='+encodeURIComponent(q+', Kinshasa, RDC');const r=await fetch(u,{headers:{'Accept-Language':'fr'}});const d=await r.json();if(!d.length)throw Error();return{lat:+d[0].lat,lon:+d[0].lon}}
function useGPS(id){navigator.geolocation.getCurrentPosition(p=>{$(id).value='Position actuelle';$(id).dataset.lat=p.coords.latitude;$(id).dataset.lon=p.coords.longitude;alert('Position enregistrée.')},()=>alert('Autorisez la localisation sur votre téléphone.'))}
async function getPoint(id){if($(id).dataset.lat)return{lat:+$(id).dataset.lat,lon:+$(id).dataset.lon};return geocode($(id).value.trim())}
async function calculateRoute(){if(!$('name').value.trim()||!$('phone').value.trim()||!$('from').value.trim()||!$('to').value.trim()){alert('Remplissez le nom, le téléphone, le départ et la destination.');return}try{const a=await getPoint('from'),b=await getPoint('to');const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;const r=await fetch(u),d=await r.json();if(d.code!=='Ok')throw Error();const km=d.routes[0].distance/1000,price=Math.max(2000,Math.round(km*1000));lastQuote={km,price};showMap();markers.forEach(m=>map.removeLayer(m));markers=[];if(routeLine)map.removeLayer(routeLine);markers.push(L.marker([a.lat,a.lon]).addTo(map).bindPopup('Départ'));markers.push(L.marker([b.lat,b.lon]).addTo(map).bindPopup('Destination'));routeLine=L.geoJSON(d.routes[0].geometry).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[20,20]});$('distance').textContent=km.toFixed(1)+' km';$('price').textContent=price.toLocaleString('fr-FR')+' FC';$('quote').style.display='block';$('quote').scrollIntoView({behavior:'smooth'})}catch(e){alert('Impossible de calculer cet itinéraire. Vérifiez les lieux et réessayez.')}}
function sendWhatsApp(){if(!lastQuote)return;const msg=`MT SERVICE — NOUVELLE COMMANDE\n\nNom: ${$('name').value}\nTéléphone: ${$('phone').value}\nService: ${$('service').value}\nDépart: ${$('from').value}\nDestination: ${$('to').value}\nDistance routière: ${lastQuote.km.toFixed(1)} km\nPRIX FIXÉ: ${lastQuote.price.toLocaleString('fr-FR')} FC`;location.href='https://wa.me/243861519618?text='+encodeURIComponent(msg)}
function resetForm(){location.reload()}
</script></body></html>
